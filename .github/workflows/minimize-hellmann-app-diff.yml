name: Minimize Hellmann app diff

on:
  push:
    branches:
      - agent/add-dr-hellmann-september-2026

permissions:
  contents: write

jobs:
  minimize-verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-dr-hellmann-september-2026
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reset app.js to main and apply only required Hellmann changes
        run: |
          git show origin/main:js/app.js > js/app.js
          node scripts/minimize-hellmann-app-diff.mjs

      - name: Remove temporary helper files
        run: rm -f scripts/minimize-hellmann-app-diff.mjs .github/workflows/minimize-hellmann-app-diff.yml

      - name: Install development dependencies
        run: npm ci

      - name: Verify minimized app diff
        run: |
          npm run lint
          npm run typecheck
          node --test test/autoplan.test.js test/constants.test.js

      - name: Commit minimized diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js scripts .github/workflows
          git commit -m "Minimize app diff for Hellmann hard cap"
          git push origin HEAD:agent/add-dr-hellmann-september-2026
