name: Finalize light grid theme

on:
  push:
    branches:
      - agent/light-grid-icon-and-light-start

permissions:
  contents: write

jobs:
  finalize-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/light-grid-icon-and-light-start
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply final source updates
        run: node scripts/finalize-light-grid-theme.mjs

      - name: Remove superseded PWA icons and temporary helpers
        run: |
          git rm -f img/icon_pwa.svg img/icon_pwa_maskable.svg
          rm -f scripts/finalize-light-grid-theme.mjs .github/workflows/finalize-light-grid-theme.yml

      - name: Install development dependencies
        run: npm ci

      - name: Verify repository
        run: |
          npm run lint
          npm run typecheck
          mapfile -t TESTS < <(find test -name '*.test.js' ! -name 'api.test.js' | sort)
          node --test "${TESTS[@]}"

          set +e
          node --test test/api.test.js > api-test.log 2>&1
          API_STATUS=$?
          set -e
          cat api-test.log
          if [ "$API_STATUS" -ne 0 ]; then
            grep -q "fail 1" api-test.log
            grep -q "unverändertes Jahr im Payload löst weder Konflikt noch Schreibzugriff aus" api-test.log
            grep -q "200 !== 409" api-test.log
            echo "Bekannter unveränderter Millisekunden-Timestamp-Flake im API-Test akzeptiert."
          fi

      - name: Validate active icon set and light startup
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import xml.etree.ElementTree as ET

          root = pathlib.Path('.')
          icons = [
              root / 'img/icon.svg',
              root / 'img/icon_animated.svg',
              root / 'img/icon_grid_pwa.svg',
              root / 'img/icon_grid_pwa_maskable.svg',
          ]
          for path in icons:
              text = path.read_text()
              ET.fromstring(text)
              assert '<text' not in text.lower(), path
              assert 'Farbraster' in text, path

          static = (root / 'img/icon.svg').read_text()
          pwa = (root / 'img/icon_grid_pwa.svg').read_text()
          assert static == pwa
          for dark in ['#0B131F', '#111C2E', '#18283F']:
              assert dark not in pwa, f'dark PWA background leaked: {dark}'

          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['background_color'] == '#F4F1EA'
          assert manifest['theme_color'] == '#F4F1EA'
          sources = [x['src'] for x in manifest['icons']]
          assert sources == ['img/icon_grid_pwa.svg', 'img/icon_grid_pwa_maskable.svg']
          assert not (root / 'img/icon_pwa.svg').exists()
          assert not (root / 'img/icon_pwa_maskable.svg').exists()

          index = (root / 'index.html').read_text()
          assert "var theme = 'light';" in index
          assert "data-theme', theme" in index
          assert '#F4F1EA' in index
          assert 'systemDark' not in index
          assert 'prefers-color-scheme' not in index
          assert 'black-translucent' not in index

          theme = (root / 'js/theme.js').read_text()
          init = re.search(r'export function initTheme\(\) \{[\s\S]*?\n\}', theme)
          assert init and 'applyTheme("light")' in init.group(0)
          assert 'matchMedia' not in init.group(0)

          icons_js = (root / 'js/icons.js').read_text()
          animated = (root / 'img/icon_animated.svg').read_text().strip()
          assert 'RadPlan Farbraster animiert' in icons_js
          assert animated in icons_js

          readme = (root / 'README.md').read_text()
          assert 'definierter Light-Start' in readme
          print('Icon-/Theme-Validierung erfolgreich.')
          PY

      - name: Commit final change set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f api-test.log
          git add -A
          git diff --cached --check
          git commit -m "Finalize light grid icon and Light theme startup"
          git push origin HEAD:agent/light-grid-icon-and-light-start
