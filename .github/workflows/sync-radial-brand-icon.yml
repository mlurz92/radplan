name: Sync radial brand icon

on:
  push:
    branches:
      - agent/replace-calendar-icon-with-radial-hub

permissions:
  contents: write

jobs:
  sync-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/replace-calendar-icon-with-radial-hub
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize inline header icon
        run: node scripts/sync-brand-icon.mjs

      - name: Remove temporary helper files
        run: rm -f scripts/sync-brand-icon.mjs .github/workflows/sync-radial-brand-icon.yml

      - name: Install development dependencies
        run: npm ci

      - name: Validate JavaScript
        run: |
          npm run lint
          npm run typecheck

      - name: Validate SVG icon set
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [
              Path('img/icon.svg'),
              Path('img/icon_animated.svg'),
              Path('img/icon_pwa.svg'),
              Path('img/icon_pwa_maskable.svg'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              ET.fromstring(text)
              if '<text' in text.lower():
                  raise SystemExit(f'{path}: text element found')
              if 'Arbeitsplatzkalender' in text:
                  raise SystemExit(f'{path}: old calendar label remains')
              if 'Planungsrad' not in text:
                  raise SystemExit(f'{path}: new icon label missing')
          if Path('img/icon.svg').read_text(encoding='utf-8') != Path('img/icon_pwa.svg').read_text(encoding='utf-8'):
              raise SystemExit('icon.svg and icon_pwa.svg must stay identical')
          print('SVG icon set valid.')
          PY

      - name: Validate inline icon synchronization
        run: |
          node --input-type=module - <<'NODE'
          const mod = await import('./js/icons.js');
          const svg = mod.ANIMATED_BRAND_ICON_SVG;
          if (!svg.includes('RadPlan Planungsrad animiert')) throw new Error('new aria-label missing');
          if (!svg.includes('class="radplan-brand-icon"')) throw new Error('brand class missing');
          if (svg.includes('Arbeitsplatzkalender')) throw new Error('old calendar motif label remains');
          NODE

      - name: Commit synchronized icon set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sync radial brand icon across app surfaces"
          git push origin HEAD:agent/replace-calendar-icon-with-radial-hub
