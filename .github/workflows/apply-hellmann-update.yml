name: Apply Hellmann roster update

on:
  push:
    branches:
      - agent/add-dr-hellmann-september-2026

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-dr-hellmann-september-2026
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply Hellmann update
        run: |
          node scripts/apply-hellmann-update.mjs
          node scripts/apply-hellmann-followup.mjs
          node -e 'const fs=require("fs"); const p="js/app.js"; const s=fs.readFileSync(p,"utf8"); fs.writeFileSync(p,s.replace(/[ \t]+(?=\r?$)/gm,""),"utf8");'

      - name: Remove temporary migration files
        run: rm -f scripts/apply-hellmann-update.mjs scripts/apply-hellmann-followup.mjs .github/workflows/apply-hellmann-update.yml

      - name: Install development dependencies
        run: npm ci

      - name: Verify repository
        run: npm run verify

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js test README.md algorithm_rules.md scripts .github/workflows
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git commit -m "Add Dr. Hellmann roster and duty rules"
          git push origin HEAD:agent/add-dr-hellmann-september-2026
